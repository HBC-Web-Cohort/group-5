    <!-- Appointment Section -->
    <main>

        <section class="page-hero">
            <div class="container">

                <h1>رزرو وقت ویزیت</h1>

                <p>
                    برای درخواست وقت ویزیت، فورم زیر را تکمیل کنید.
                </p>

            </div>
        </section>


        <section class="appointment-section">

            <div class="container">

                <div class="appointment-card">

                    <h2>فورم درخواست ویزیت</h2>

                    <p class="form-description">
                        لطفاً معلومات خود را به‌صورت درست وارد کنید.
                    </p>


                    <form id="appointmentForm">

                        <!-- Full Name -->
                        <div class="form-group">

                            <label for="fullName">
                                نام کامل
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="نام کامل خود را وارد کنید"
                                required
                                minlength="3"
                            >

                        </div>


                        <!-- Phone Number -->
                        <div class="form-group">

                            <label for="phone">
                                شماره تماس
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="شماره تماس خود را وارد کنید"
                                required
                            >

                        </div>


                        <!-- Appointment Date -->
                        <div class="form-group">

                            <label for="appointmentDate">
                                تاریخ ویزیت
                            </label>

                            <input
                                type="date"
                                id="appointmentDate"
                                name="appointmentDate"
                                required
                            >

                        </div>


                        <!-- Service Selection -->
                        <div class="form-group">

                            <label for="service">
                                خدمت مورد نیاز
                            </label>

                            <select
                                id="service"
                                name="service"
                                required
                            >

                                <option value="">
                                    یک خدمت را انتخاب کنید
                                </option>

                                <option value="examination">
                                    معاینه دندان
                                </option>

                                <option value="cleaning">
                                    پاک‌کاری دندان
                                </option>

                                <option value="whitening">
                                    سفیدسازی دندان
                                </option>

                                <option value="other">
                                    سایر خدمات
                                </option>

                            </select>

                        </div>


                        <!-- Additional Message -->
                        <div class="form-group">

                            <label for="message">
                                توضیحات اضافی (اختیاری)
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="4"
                                placeholder="اگر توضیحی دارید، اینجا بنویسید"
                            ></textarea>

                        </div>


                        <!-- Submit Button -->
                        <button type="submit" class="button submit-button">
                            ثبت درخواست
                        </button>


                        <!-- Form Feedback -->
                        <p
                            id="formMessage"
                            class="form-message"
                            role="status"
                            aria-live="polite"
                        ></p>

                    </form>

                </div>

            </div>

        </section>

    </main>
